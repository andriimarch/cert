<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Certificate Verification</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --success: #22c55e;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px 0; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    .info-grid {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      font-size: 0.9rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
    }
    .info-row:last-child { border-bottom: none; }
    .label { color: #64748b; }
    .value { font-weight: 600; text-align: right; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="pulse"></span> 100% VERIFIED AUTHENTIC
    </div>
    <h1>Certificate of Excellence</h1>
    <p>Issued by the Special Training Center «A-T.E.A.M.»</p>

    <div class="info-grid">
      <div class="info-row">
        <span class="label">Recipient:</span>
        <span class="value" id="recipient-name">Ahmed Karran</span>
      </div>
      <div class="info-row">
        <span class="label">Completion:</span>
        <span class="value" id="award-title">HI CQB/Tactical Assault Team Course</span>
      </div>
      <div class="info-row">
        <span class="label">Status:</span>
        <span class="value" style="color: #22c55e;">Active & Valid</span>
      </div>
    </div>
  </div>
</body>
</html>
